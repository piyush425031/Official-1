name: Build Star Follower APK

on:
  push:
    branches:
      - replit-agent
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Latest pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web Assets with PNPM & Vite
        run: |
          rm -rf dist android capacitor.config.json
          pnpm install --no-frozen-lockfile
          
          # Install Plugins: In-App Browser + Native Android Share Plugin
          pnpm add -w @capacitor/core @capacitor/android @capacitor/browser @capacitor/share
          pnpm add -w -D @capacitor/cli

          # Force relative paths in Vite build
          npx vite build --base=./ || true
          
          # Fallback: Agar dist nahi bana ya incomplete hai
          mkdir -p dist
          cp -r *.html *.js *.css assets public dist/ 2>/dev/null || true

          # Inject CSS & Native Android WebShare + Intent Link Handling Script
          node -e '
            const fs = require("fs");
            if (fs.existsSync("dist/index.html")) {
              let html = fs.readFileSync("dist/index.html", "utf8");
              if (!html.includes("<base")) {
                html = html.replace("<head>", "<head><base href=\"./\">");
              }

              // Forced CSS for Full Height Choice 2
              const fullScreenCSS = `
                <style>
                  iframe, embed, object, .iframe-container, #timewall-container, div[class*="offerwall"], div[class*="choice2"] {
                    width: 100% !important;
                    height: calc(100vh - 70px) !important;
                    min-height: 85vh !important;
                    border: none !important;
                    display: block !important;
                  }
                  body, html {
                    overflow-x: hidden !important;
                  }
                </style>
              `;

              // Intent Link Handling & Native Share Script
              const nativeShareScript = `
                <script>
                  // Override navigator.share for Android Native Share Sheet
                  if (window.Capacitor && window.Capacitor.Plugins) {
                    const originalShare = navigator.share;
                    navigator.share = function(shareData) {
                      if (window.Capacitor.Plugins.Share) {
                        return window.Capacitor.Plugins.Share.share({
                          title: shareData.title || "Star Follower",
                          text: shareData.text || "",
                          url: shareData.url || window.location.href,
                          dialogTitle: "Share via"
                        });
                      }
                      return originalShare ? originalShare.apply(navigator, arguments) : Promise.reject("Not supported");
                    };
                  }

                  // Handle Play Store and Intent URLs to prevent ERR_UNKNOWN_URL_SCHEME
                  document.addEventListener("click", function(e) {
                    const target = e.target.closest("a, button");
                    if (target) {
                      let href = target.getAttribute("href") || target.getAttribute("onclick") || "";
                      if (href.startsWith("intent://") || href.startsWith("market://") || href.includes("play.google.com")) {
                        e.preventDefault();
                        if (href.startsWith("intent://")) {
                          // Extract http/https fallback URL from intent string
                          const match = href.match(/scheme=(https?);.*?package=([^;]+)/) || href.match(/S.browser_fallback_url=([^;]+)/);
                          if (match && match[1]) {
                            href = decodeURIComponent(match[1]);
                          } else {
                            const pkgMatch = href.match(/package=([^;]+)/);
                            if (pkgMatch) {
                              href = "https://play.google.com/store/apps/details?id=" + pkgMatch[1];
                            }
                          }
                        }
                        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
                          window.Capacitor.Plugins.Browser.open({ url: href });
                        } else {
                          window.open(href, "_blank");
                        }
                      }
                    }
                  }, true);
                </script>
              `;

              html = html.replace("</head>", fullScreenCSS + nativeShareScript + "</head>");
              fs.writeFileSync("dist/index.html", html);
            }
          '

          # Capacitor initialization
          npx cap init "Star Follower" "com.starfollower.official" --web-dir dist
          
          # Enable Cleartext Traffic and Navigation
          node -e '
            const fs = require("fs");
            if (fs.existsSync("capacitor.config.json")) {
              let config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              config.server = { "cleartext": true, "allowNavigation": ["*"] };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
            }
          '

          npx cap add android
          
          # Inject Permissions in AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let manifest = fs.readFileSync(manifestPath, "utf8");
              if (!manifest.includes("android:usesCleartextTraffic")) {
                manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\" ");
                fs.writeFileSync(manifestPath, manifest);
              }
            }
          '

          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Star-Follower-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
